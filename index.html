<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realtime RPG Square Land Map</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    #ui-panel {
      position: absolute; 
      top: 12px; 
      left: 12px; 
      z-index: 10;
      width: 300px;                       /* Fixed compact width */
      max-width: calc(100vw - 24px);      /* Ensures it doesn't overflow small screens */
      box-sizing: border-box;
      background: rgba(13, 17, 23, 0.92); 
      color: #e6edf3;
      padding: 14px 18px; 
      border-radius: 12px; 
      border: 1px solid #30363d;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      font-size: 15px;
    }
    #ui-panel h3 { margin: 0 0 6px 0; font-size: 18px; }
    #status { font-size: 14px; color: #38bdf8; margin-bottom: 8px; }
    #plot-info { margin-top: 8px; font-size: 14px; line-height: 1.4; }

    .btn {
      width: 100%; padding: 10px; color: white;
      border: none; border-radius: 8px; font-weight: bold; font-size: 14px;
      cursor: pointer; margin-top: 6px;
      transition: background-color 0.2s ease;
    }
    .gps-btn { background-color: #2563eb; }
    .gps-btn:active { background-color: #1d4ed8; }
    
    /* Toggle Button States */
    .autocenter-on { background-color: #16a34a; }
    .autocenter-on:active { background-color: #15803d; }
    
    .autocenter-off { background-color: #475569; }
    .autocenter-off:active { background-color: #334155; }

    .badge {
      display: inline-block; padding: 3px 10px; font-size: 12px;
      border-radius: 6px; font-weight: bold; margin-top: 4px;
    }
    .claimed { background-color: #2563eb; color: #fff; }
    .wild { background-color: #10b981; color: #fff; }

    /* Custom Player Character Avatar Marker */
    .player-marker {
      width: 48px;
      height: 48px;
      background-image: url('player.png'); /* Ensure your image is named player.png */
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="ui-panel">
  <h3>⚔️ GPS Land Claimer</h3>
  <div id="status">Tap button below to lock GPS</div>
  <button id="gps-button" class="btn gps-btn">📍 Find My Location</button>
  <button id="autocenter-button" class="btn autocenter-on" style="display: none;">🎯 Auto-Center: ON</button>
  <div id="plot-info"></div>
</div>

<div id="map"></div>

<script>
  let userLat = 40.7128;
  let userLng = -74.006;
  let autoCenterEnabled = true;

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    center: [userLng, userLat],
    zoom: 18
  });

  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { 
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    },
    trackUserLocation: true,
    showUserLocation: false, // Disabled default blue dot
    showAccuracyCircle: true
  });

  map.addControl(geolocate);

  // Custom player marker element
  const playerEl = document.createElement('div');
  playerEl.className = 'player-marker';

  const playerMarker = new maplibregl.Marker({
    element: playerEl,
    anchor: 'center'
  });

  // ~50 meters North-South
  const PLOT_SIZE_LAT = 0.00045; 

  // Calculate standard E-W longitude size for 1:1 aspect ratio at target latitude
  function getLngSize(lat) {
    const rad = lat * Math.PI / 180;
    return PLOT_SIZE_LAT / Math.cos(rad);
  }

  // Create a polygon feature using precise integer grid boundaries
  function createPlotFeature(gridX, gridY, lngSize, playerGridX, playerGridY) {
    const minLat = gridY * PLOT_SIZE_LAT;
    const maxLat = (gridY + 1) * PLOT_SIZE_LAT;
    const minLng = gridX * lngSize;
    const maxLng = (gridX + 1) * lngSize;

    const plotId = `plot_${gridY}_${gridX}`;
    const isClaimed = (gridX === playerGridX && gridY === playerGridY);

    return {
      type: 'Feature',
      properties: {
        plotId: plotId,
        isClaimed: isClaimed
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [minLng, minLat],
          [maxLng, minLat],
          [maxLng, maxLat],
          [minLng, maxLat],
          [minLng, minLat]
        ]]
      }
    };
  }

  // Generate seamless grid surrounding player integer grid tile
  function generateSquareGrid(centerLat, centerLng) {
    const features = [];
    const gridRadius = 4;
    const lngSize = getLngSize(centerLat);

    // Convert GPS float coordinates into discrete integer grid indices
    const playerGridY = Math.floor(centerLat / PLOT_SIZE_LAT);
    const playerGridX = Math.floor(centerLng / lngSize);

    for (let x = -gridRadius; x <= gridRadius; x++) {
      for (let y = -gridRadius; y <= gridRadius; y++) {
        const gridX = playerGridX + x;
        const gridY = playerGridY + y;
        features.push(createPlotFeature(gridX, gridY, lngSize, playerGridX, playerGridY));
      }
    }
    return features;
  }

  // Helper to update Auto-Center button visuals
  function updateAutoCenterUI() {
    const btn = document.getElementById('autocenter-button');
    if (autoCenterEnabled) {
      btn.className = 'btn autocenter-on';
      btn.innerText = '🎯 Auto-Center: ON';
    } else {
      btn.className = 'btn autocenter-off';
      btn.innerText = '📍 Auto-Center: OFF (Tap to Lock)';
    }
  }

  map.on('load', () => {
    // 🎨 Custom RPG Style Overrides
    map.getStyle().layers.forEach(layer => {
      const id = layer.id.toLowerCase();

      // 1. Hide all building polygons & footprints
      if (id.includes('building')) {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      }

// 2. Recolor water polygons and channels to rich RPG blue (including creeks/streams)
if (
  id.includes('water') || 
  id.includes('river') || 
  id.includes('lake') || 
  id.includes('ocean') || 
  id.includes('sea') ||
  id.includes('stream') ||
  id.includes('canal') ||
  id.includes('drain') ||
  id.includes('ditch')
) {
  if (layer.type === 'fill') {
    map.setPaintProperty(layer.id, 'fill-color', '#2b65ec');
  } else if (layer.type === 'line') {
    map.setPaintProperty(layer.id, 'line-color', '#2b65ec');
    map.setPaintProperty(layer.id, 'line-width', 3); // Makes thin creek lines visible at zoom 18
  }
}

      // 3. Recolor background and land polygons to grass green
      if (layer.type === 'background') {
        map.setPaintProperty(layer.id, 'background-color', '#3e7b41');
      }
      if ((id.includes('land') || id.includes('park') || id.includes('green') || id.includes('wood') || id.includes('scrub')) && layer.type === 'fill' && !id.includes('water')) {
        map.setPaintProperty(layer.id, 'fill-color', '#488a4b');
      }

      // 4. Recolor roads to dirt paths (earthy brown)
      if ((id.includes('road') || id.includes('highway') || id.includes('street') || id.includes('transport')) && layer.type === 'line') {
        if (id.includes('case') || id.includes('outline')) {
          map.setPaintProperty(layer.id, 'line-color', '#5c4028'); // Dark dirt border
        } else {
          map.setPaintProperty(layer.id, 'line-color', '#9e7853'); // Dirt path
        }
      }
    });

    // Boost text sizes for high-DPI screens
    //map.getStyle().layers.forEach(layer => {
      //if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
        //map.setLayoutProperty(layer.id, 'text-size', [
          //'interpolate', ['linear'], ['zoom'],
          //10, 14,
          //16, 20
        //]);
      //}
    //});

    // 🙈 Hide all text labels, road names, and place markers
    map.getStyle().layers.forEach(layer => {
      if (layer.type === 'symbol') {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      }
    });

    const initialFeatures = generateSquareGrid(userLat, userLng);

    map.addSource('square-plots', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: initialFeatures }
    });

    map.addLayer({
      id: 'plots-fill',
      type: 'fill',
      source: 'square-plots',
      paint: {
        'fill-color': ['case', ['get', 'isClaimed'], '#2563eb', '#10b981'],
        'fill-opacity': 0.35
      }
    });

    map.addLayer({
      id: 'plots-outline',
      type: 'line',
      source: 'square-plots',
      paint: {
        'line-color': '#1e293b',
        'line-width': 2,
        'line-opacity': 0.7
      }
    });

    // Tap button to manually trigger GPS
    document.getElementById('gps-button').addEventListener('click', () => {
      document.getElementById('status').innerText = '⌛ Acquiring GPS fix...';
      geolocate.trigger();
    });

    // Toggle Auto-Center state or force center + zoom level 18
    document.getElementById('autocenter-button').addEventListener('click', () => {
      autoCenterEnabled = !autoCenterEnabled;
      updateAutoCenterUI();

      if (autoCenterEnabled) {
        map.flyTo({
          center: [userLng, userLat],
          zoom: 18,
          essential: true
        });
      }
    });

    // Pause Auto-Center if user manually drags/pans map
    map.on('dragstart', () => {
      if (autoCenterEnabled) {
        autoCenterEnabled = false;
        updateAutoCenterUI();
      }
    });

    // Pause Auto-Center if user manually pinches/scroll zooms
    map.on('zoomstart', (e) => {
      // originalEvent exists on manual user gestures, but is undefined on programmatic camera calls
      if (e.originalEvent && autoCenterEnabled) {
        autoCenterEnabled = false;
        updateAutoCenterUI();
      }
    });

    // Successful Location Tracking
    geolocate.on('geolocate', (e) => {
      userLat = e.coords.latitude;
      userLng = e.coords.longitude;

      document.getElementById('status').innerText = `📍 Signal Active (${e.coords.accuracy.toFixed(0)}m accuracy)`;
      document.getElementById('gps-button').style.display = 'none';
      document.getElementById('autocenter-button').style.display = 'block';

      // Update custom player image position
      playerMarker.setLngLat([userLng, userLat]).addTo(map);

      // Update grid tiles around new player position
      const updatedFeatures = generateSquareGrid(userLat, userLng);
      map.getSource('square-plots').setData({
        type: 'FeatureCollection',
        features: updatedFeatures
      });

      // Smooth camera follow enforcing zoom 18 if auto-center is active
      if (autoCenterEnabled) {
        map.easeTo({
          center: [userLng, userLat],
          zoom: 18,
          duration: 1000,
          essential: true
        });
      }
    });

    // Detailed Mobile Error Diagnostics
    geolocate.on('error', (e) => {
      console.error('GPS Error Details:', e);
      let errorMsg = 'Unknown GPS Error';
      
      if (e.code === 1) errorMsg = 'Permission Denied by OS/Browser';
      if (e.code === 2) errorMsg = 'Position Unavailable (Weak Signal)';
      if (e.code === 3) errorMsg = 'GPS Timed Out (Try again outside)';

      document.getElementById('status').innerHTML = 
        `<span style="color:#ef4444;">⚠️ ${errorMsg}</span>`;
    });

    // Inspect Plots
    map.on('click', 'plots-fill', (e) => {
      const props = e.features[0].properties;
      const statusBadge = props.isClaimed 
        ? '<span class="badge claimed">Home Base</span>' 
        : '<span class="badge wild">Wilderness (100 Gold)</span>';

      document.getElementById('plot-info').innerHTML = `
        <b>Plot ID:</b> ${props.plotId}<br/>
        <b>Status:</b> ${statusBadge}
      `;
    });
  });
</script>
</body>
</html>
