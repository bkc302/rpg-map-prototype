<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- 1. CRITICAL FOR MOBILE: Fixes tiny microscopic text and viewport zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realtime RPG Square Land Map</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    /* Mobile-optimized responsive UI overlay */
    #ui-panel {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: rgba(13, 17, 23, 0.92); color: #e6edf3;
      padding: 14px 18px; border-radius: 12px; border: 1px solid #30363d;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      font-size: 15px;
    }
    #ui-panel h3 { margin: 0 0 6px 0; font-size: 18px; }
    #status { font-size: 14px; color: #38bdf8; }
    #plot-info { margin-top: 8px; font-size: 14px; line-height: 1.4; }

    .badge {
      display: inline-block; padding: 3px 10px; font-size: 12px;
      border-radius: 6px; font-weight: bold; margin-top: 4px;
    }
    .claimed { background-color: #2563eb; color: #fff; }
    .wild { background-color: #10b981; color: #fff; }
  </style>
</head>
<body>

<div id="ui-panel">
  <h3>⚔️ GPS Land Claimer</h3>
  <div id="status">Acquiring GPS Signal...</div>
  <div id="plot-info"></div>
</div>

<div id="map"></div>

<script>
  let userLat = 40.7128;
  let userLng = -74.006;

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    center: [userLng, userLat],
    zoom: 16
  });

  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showAccuracyCircle: true
  });

  map.addControl(geolocate);

  // Square Plot Size (~50m x 50m)
  const PLOT_SIZE = 0.0005;

  function getSquarePlotCoordinates(lat, lng) {
    const minLat = Math.floor(lat / PLOT_SIZE) * PLOT_SIZE;
    const maxLat = minLat + PLOT_SIZE;
    const minLng = Math.floor(lng / PLOT_SIZE) * PLOT_SIZE;
    const maxLng = minLng + PLOT_SIZE;

    const plotId = `plot_${minLat.toFixed(4)}_${minLng.toFixed(4)}`;

    const coordinates = [[
      [minLng, minLat],
      [maxLng, minLat],
      [maxLng, maxLat],
      [minLng, maxLat],
      [minLng, minLat]
    ]];

    return { plotId, coordinates };
  }

  function generateSquareGrid(centerLat, centerLng) {
    const features = [];
    const gridRadius = 3;

    for (let x = -gridRadius; x <= gridRadius; x++) {
      for (let y = -gridRadius; y <= gridRadius; y++) {
        const targetLat = centerLat + (y * PLOT_SIZE);
        const targetLng = centerLng + (x * PLOT_SIZE);
        const { plotId, coordinates } = getSquarePlotCoordinates(targetLat, targetLng);

        const isCurrentStandingPlot = (x === 0 && y === 0);

        features.push({
          type: 'Feature',
          properties: {
            plotId: plotId,
            isClaimed: isCurrentStandingPlot
          },
          geometry: { type: 'Polygon', coordinates: coordinates }
        });
      }
    }
    return features;
  }

  map.on('load', () => {
    // 2. Increase text size across map street and park labels for high-DPI phone screens
    map.getStyle().layers.forEach(layer => {
      if (layer.type === 'symbol' && layer.layout && layer.layout['text-field']) {
        map.setLayoutProperty(layer.id, 'text-size', [
          'interpolate', ['linear'], ['zoom'],
          10, 14,
          16, 20
        ]);
      }
    });

    geolocate.trigger();

    const initialFeatures = generateSquareGrid(userLat, userLng);

    map.addSource('square-plots', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: initialFeatures }
    });

    map.addLayer({
      id: 'plots-fill',
      type: 'fill',
      source: 'square-plots',
      paint: {
        'fill-color': ['case', ['get', 'isClaimed'], '#2563eb', '#10b981'],
        'fill-opacity': 0.35
      }
    });

    map.addLayer({
      id: 'plots-outline',
      type: 'line',
      source: 'square-plots',
      paint: {
        'line-color': '#1e293b',
        'line-width': 2,
        'line-opacity': 0.7
      }
    });

    // Successful Location Tracking
    geolocate.on('geolocate', (e) => {
      userLat = e.coords.latitude;
      userLng = e.coords.longitude;

      document.getElementById('status').innerText = `📍 Signal Active (${e.coords.accuracy.toFixed(0)}m accuracy)`;

      const updatedFeatures = generateSquareGrid(userLat, userLng);
      map.getSource('square-plots').setData({
        type: 'FeatureCollection',
        features: updatedFeatures
      });
    });

    // Mobile GPS Error Handler
    geolocate.on('error', (e) => {
      console.error('GPS Error:', e);
      document.getElementById('status').innerHTML = 
        `<span style="color:#ef4444;">⚠️ Location Blocked:</span> ${e.message}<br/>` +
        `<small style="color:#cbd5e1;">Mobile requires <b>HTTPS://</b> or GitHub Pages to allow GPS!</small>`;
    });

    // Inspect Plots
    map.on('click', 'plots-fill', (e) => {
      const props = e.features[0].properties;
      const statusBadge = props.isClaimed 
        ? '<span class="badge claimed">Home Base</span>' 
        : '<span class="badge wild">Wilderness (100 Gold)</span>';

      document.getElementById('plot-info').innerHTML = `
        <b>Plot ID:</b> ${props.plotId}<br/>
        <b>Status:</b> ${statusBadge}
      `;
    });
  });
</script>
</body>
</html>
