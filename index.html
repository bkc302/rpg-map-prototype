<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realtime RPG Square Land Map</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    #ui-panel {
      position: absolute; 
      top: 12px; 
      left: 12px; 
      z-index: 10;
      width: 300px;
      max-width: calc(100vw - 24px);
      box-sizing: border-box;
      background: rgba(13, 17, 23, 0.92); 
      color: #e6edf3;
      padding: 14px 18px; 
      border-radius: 12px; 
      border: 1px solid #30363d;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      font-size: 15px;
    }
    #ui-panel h3 { margin: 0 0 4px 0; font-size: 18px; }
    #gold-display { font-size: 16px; font-weight: bold; color: #facc15; margin-bottom: 6px; }
    #status { font-size: 13px; color: #38bdf8; margin-bottom: 8px; }
    
    #plot-card {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
      font-size: 14px;
      line-height: 1.4;
    }

    .btn {
      width: 100%; padding: 10px; color: white;
      border: none; border-radius: 8px; font-weight: bold; font-size: 14px;
      cursor: pointer; margin-top: 6px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }
    .gps-btn { background-color: #2563eb; }
    .gps-btn:active { background-color: #1d4ed8; }
    
    .buy-btn { background-color: #16a34a; }
    .buy-btn:hover { background-color: #15803d; }
    .buy-btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.6; }

    /* Toggle Button States */
    .autocenter-on { background-color: #16a34a; }
    .autocenter-on:active { background-color: #15803d; }
    
    .autocenter-off { background-color: #475569; }
    .autocenter-off:active { background-color: #334155; }

    .badge {
      display: inline-block; padding: 3px 10px; font-size: 12px;
      border-radius: 6px; font-weight: bold; margin-top: 4px;
    }
    .claimed { background-color: #2563eb; color: #fff; }
    .wild { background-color: #10b981; color: #fff; }

    /* Custom Player Character Avatar Marker */
    .player-marker {
      width: 48px;
      height: 48px;
      background-image: url('player.png'); /* Ensure your image is named player.png */
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
      cursor: pointer;
    }
    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-bottom-right {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="ui-panel">
  <h3>⚔️ GPS Land Claimer</h3>
  <div id="gold-display">💰 Gold: <span id="gold-amount">100</span></div>
  <div id="status">Tap button below to lock GPS</div>
  <button id="gps-button" class="btn gps-btn">📍 Find My Location</button>
  <button id="autocenter-button" class="btn autocenter-on" style="display: none;">🎯 Auto-Center: ON</button>
  
  <div id="plot-card">
    <div id="plot-info"><i>Tap any square on the map to inspect or buy.</i></div>
  </div>
</div>

<div id="map"></div>

<script>
  let userLat = 40.7128;
  let userLng = -74.006;
  let autoCenterEnabled = true;

  // Game Economy & Land Ownership State
  let playerGold = 100;
  const PLOT_PRICE = 100;
  const claimedPlotIds = new Set(); // Stores owned plot ID strings
  let selectedPlotId = null;        // Currently inspected plot ID

  // Screen Wake Lock Handler
  let wakeLock = null;

  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('💡 Screen Wake Lock active');
      } catch (err) {
        console.warn(`Wake Lock error: ${err.name}, ${err.message}`);
      }
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    center: [userLng, userLat],
    zoom: 18
  });

  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { 
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    },
    trackUserLocation: true,
    showUserLocation: false,
    showAccuracyCircle: true
  });

  map.addControl(geolocate);

  const playerEl = document.createElement('div');
  playerEl.className = 'player-marker';

  const playerMarker = new maplibregl.Marker({
    element: playerEl,
    anchor: 'center'
  });

  // ~50 meters North-South
  const PLOT_SIZE_LAT = 0.00045; 

  function getLngSize(lat) {
    const rad = lat * Math.PI / 180;
    return PLOT_SIZE_LAT / Math.cos(rad);
  }

  function createPlotFeature(gridX, gridY, lngSize) {
    const minLat = gridY * PLOT_SIZE_LAT;
    const maxLat = (gridY + 1) * PLOT_SIZE_LAT;
    const minLng = gridX * lngSize;
    const maxLng = (gridX + 1) * lngSize;

    const plotId = `plot_${gridY}_${gridX}`;
    const isClaimed = claimedPlotIds.has(plotId);
    const isSelected = (plotId === selectedPlotId);

    return {
      type: 'Feature',
      properties: {
        plotId: plotId,
        isClaimed: isClaimed,
        isSelected: isSelected
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [minLng, minLat],
          [maxLng, minLat],
          [maxLng, maxLat],
          [minLng, maxLat],
          [minLng, minLat]
        ]]
      }
    };
  }

  function generateSquareGrid(centerLat, centerLng) {
    const features = [];
    const gridRadius = 4;
    const lngSize = getLngSize(centerLat);

    const playerGridY = Math.floor(centerLat / PLOT_SIZE_LAT);
    const playerGridX = Math.floor(centerLng / lngSize);

    for (let x = -gridRadius; x <= gridRadius; x++) {
      for (let y = -gridRadius; y <= gridRadius; y++) {
        const gridX = playerGridX + x;
        const gridY = playerGridY + y;
        features.push(createPlotFeature(gridX, gridY, lngSize));
      }
    }
    return features;
  }

  function refreshMapGrid() {
    if (map.getSource('square-plots')) {
      const updatedFeatures = generateSquareGrid(userLat, userLng);
      map.getSource('square-plots').setData({
        type: 'FeatureCollection',
        features: updatedFeatures
      });
    }
  }

  function updateGoldDisplay() {
    document.getElementById('gold-amount').innerText = playerGold;
  }

  function renderSelectedPlotCard() {
    const container = document.getElementById('plot-info');

    if (!selectedPlotId) {
      container.innerHTML = `<i>Tap any square on the map to inspect or buy.</i>`;
      return;
    }

    const isOwned = claimedPlotIds.has(selectedPlotId);

    if (isOwned) {
      container.innerHTML = `
        <b>Plot ID:</b> ${selectedPlotId}<br/>
        <b>Status:</b> <span class="badge claimed">Claimed (Owned)</span>
      `;
    } else {
      const canAfford = playerGold >= PLOT_PRICE;
      const buttonText = canAfford ? `🛒 Buy Plot (${PLOT_PRICE} Gold)` : `❌ Need ${PLOT_PRICE} Gold`;
      const disabledAttr = canAfford ? '' : 'disabled';

      container.innerHTML = `
        <b>Plot ID:</b> ${selectedPlotId}<br/>
        <b>Price:</b> 💰 ${PLOT_PRICE} Gold<br/>
        <b>Status:</b> <span class="badge wild">Wilderness</span><br/>
        <button id="buy-plot-btn" class="btn buy-btn" ${disabledAttr}>${buttonText}</button>
      `;

      if (canAfford) {
        document.getElementById('buy-plot-btn').addEventListener('click', buySelectedPlot);
      }
    }
  }

  function buySelectedPlot() {
    if (!selectedPlotId || claimedPlotIds.has(selectedPlotId)) return;

    if (playerGold >= PLOT_PRICE) {
      playerGold -= PLOT_PRICE;
      claimedPlotIds.add(selectedPlotId);

      updateGoldDisplay();
      renderSelectedPlotCard();
      refreshMapGrid();
    }
  }

  function updateAutoCenterUI() {
    const btn = document.getElementById('autocenter-button');
    if (autoCenterEnabled) {
      btn.className = 'btn autocenter-on';
      btn.innerText = '🎯 Auto-Center: ON';
    } else {
      btn.className = 'btn autocenter-off';
      btn.innerText = '📍 Auto-Center: OFF (Tap to Lock)';
    }
  }

  map.on('load', () => {
    // 🎨 Custom RPG Style Overrides
    map.getStyle().layers.forEach(layer => {
      const id = layer.id.toLowerCase();

      if (id.includes('building')) {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      }

      if (id.includes('water') || id.includes('river') || id.includes('lake') || id.includes('ocean') || id.includes('sea')) {
        if (layer.type === 'fill') {
          map.setPaintProperty(layer.id, 'fill-color', '#2b65ec');
        } else if (layer.type === 'line') {
          map.setPaintProperty(layer.id, 'line-color', '#1d4ed8');
        }
      }

      if (layer.type === 'background') {
        map.setPaintProperty(layer.id, 'background-color', '#3e7b41');
      }
      if ((id.includes('land') || id.includes('park') || id.includes('green') || id.includes('wood') || id.includes('scrub')) && layer.type === 'fill' && !id.includes('water')) {
        map.setPaintProperty(layer.id, 'fill-color', '#488a4b');
      }

      if ((id.includes('road') || id.includes('highway') || id.includes('street') || id.includes('transport')) && layer.type === 'line') {
        if (id.includes('case') || id.includes('outline')) {
          map.setPaintProperty(layer.id, 'line-color', '#5c4028');
        } else {
          map.setPaintProperty(layer.id, 'line-color', '#9e7853');
        }
      }

      if (layer.type === 'symbol') {
        map.setLayoutProperty(layer.id, 'visibility', 'none');
      }
    });

    const initialFeatures = generateSquareGrid(userLat, userLng);

    map.addSource('square-plots', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: initialFeatures }
    });

    // 1. Fill Layer: Transparent fill for tap detection
    map.addLayer({
      id: 'plots-fill',
      type: 'fill',
      source: 'square-plots',
      paint: {
        'fill-color': '#000000',
        'fill-opacity': 0
      }
    });

    // 2. Standard Grid Lines (Unclaimed & Unselected plots)
    map.addLayer({
      id: 'plots-outline',
      type: 'line',
      source: 'square-plots',
      filter: ['all', ['!', ['get', 'isClaimed']], ['!', ['get', 'isSelected']]],
      paint: {
        'line-color': '#1e293b',
        'line-width': 2,
        'line-opacity': 0.7
      }
    });

    // 3. Selected Plot Outline (Bright Red)
    map.addLayer({
      id: 'plots-selected-outline',
      type: 'line',
      source: 'square-plots',
      filter: ['get', 'isSelected'],
      paint: {
        'line-color': '#ef4444', // Bright RPG Red
        'line-width': 4,
        'line-opacity': 1.0
      }
    });

    // 4. Claimed Plot Outline (Bold Yellow Square)
    map.addLayer({
      id: 'plots-claimed-outline',
      type: 'line',
      source: 'square-plots',
      filter: ['get', 'isClaimed'],
      paint: {
        'line-color': '#eab308', // Bright RPG Yellow
        'line-width': 4,
        'line-opacity': 1.0
      }
    });

    // GPS Controls
    document.getElementById('gps-button').addEventListener('click', () => {
      document.getElementById('status').innerText = '⌛ Acquiring GPS fix...';
      geolocate.trigger();
    });

    document.getElementById('autocenter-button').addEventListener('click', () => {
      autoCenterEnabled = !autoCenterEnabled;
      updateAutoCenterUI();

      if (autoCenterEnabled) {
        map.flyTo({
          center: [userLng, userLat],
          zoom: 18,
          essential: true
        });
      }
    });

    map.on('dragstart', () => {
      if (autoCenterEnabled) {
        autoCenterEnabled = false;
        updateAutoCenterUI();
      }
    });

    map.on('zoomstart', (e) => {
      if (e.originalEvent && autoCenterEnabled) {
        autoCenterEnabled = false;
        updateAutoCenterUI();
      }
    });

    // Successful Location Tracking
    geolocate.on('geolocate', (e) => {
      userLat = e.coords.latitude;
      userLng = e.coords.longitude;

      requestWakeLock();

      document.getElementById('status').innerText = `📍 Signal Active (${e.coords.accuracy.toFixed(0)}m accuracy)`;
      document.getElementById('gps-button').style.display = 'none';
      document.getElementById('autocenter-button').style.display = 'block';

      playerMarker.setLngLat([userLng, userLat]).addTo(map);
      refreshMapGrid();

      if (autoCenterEnabled) {
        map.easeTo({
          center: [userLng, userLat],
          zoom: 18,
          duration: 1000,
          essential: true
        });
      }
    });

    geolocate.on('error', (e) => {
      console.error('GPS Error Details:', e);
      let errorMsg = 'Unknown GPS Error';
      if (e.code === 1) errorMsg = 'Permission Denied';
      if (e.code === 2) errorMsg = 'Position Unavailable';
      if (e.code === 3) errorMsg = 'GPS Timed Out';

      document.getElementById('status').innerHTML = `<span style="color:#ef4444;">⚠️ ${errorMsg}</span>`;
    });

    // Handle Plot Selection on Click/Tap
    map.on('click', 'plots-fill', (e) => {
      if (e.features.length > 0) {
        selectedPlotId = e.features[0].properties.plotId;
        renderSelectedPlotCard();
        refreshMapGrid();
      }
    });
  });
</script>
</body>
</html>
