<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realtime RPG Fixed Land Grid</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    #ui-panel {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      background: rgba(13, 17, 23, 0.92); color: #e6edf3;
      padding: 14px 18px; border-radius: 12px; border: 1px solid #30363d;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      font-size: 15px;
    }
    #ui-panel h3 { margin: 0 0 4px 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    #gold-counter { font-size: 15px; color: #f59e0b; font-weight: bold; }
    #status { font-size: 14px; color: #38bdf8; margin-bottom: 8px; }
    #plot-info { margin-top: 8px; font-size: 14px; line-height: 1.4; }

    .btn {
      width: 100%; padding: 10px; color: white;
      border: none; border-radius: 8px; font-weight: bold; font-size: 14px;
      cursor: pointer; margin-top: 6px;
      transition: background-color 0.2s ease;
    }
    .gps-btn { background-color: #2563eb; }
    .gps-btn:active { background-color: #1d4ed8; }
    
    .claim-btn { background-color: #10b981; }
    .claim-btn:active { background-color: #059669; }
    .claim-btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.6; }

    .autocenter-on { background-color: #16a34a; }
    .autocenter-on:active { background-color: #15803d; }
    .autocenter-off { background-color: #475569; }
    .autocenter-off:active { background-color: #334155; }

    .badge {
      display: inline-block; padding: 3px 10px; font-size: 12px;
      border-radius: 6px; font-weight: bold; margin-top: 4px;
    }
    .claimed { background-color: #2563eb; color: #fff; }
    .reachable { background-color: #10b981; color: #fff; }
    .unreachable { background-color: #ef4444; color: #fff; }

    .player-marker {
      width: 48px; height: 48px;
      background-image: url('player.png');
      background-size: contain; background-repeat: no-repeat; background-position: center;
      image-rendering: pixelated;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
    }
  </style>
</head>
<body>

<div id="ui-panel">
  <h3>
    <span>⚔️ GPS Land Claimer</span>
    <span id="gold-counter">🪙 0 Gold</span>
  </h3>
  <div id="status">Tap button below to lock GPS</div>
  <button id="gps-button" class="btn gps-btn">📍 Find My Location</button>
  <button id="autocenter-button" class="btn autocenter-on" style="display: none;">🎯 Auto-Center: ON</button>
  <div id="plot-info"></div>
</div>

<div id="map"></div>

<script>
  let userLat = 40.7128;
  let userLng = -74.006;
  let autoCenterEnabled = true;
  let totalGold = 0;

  // 🎯 Reach distance configuration (10 meters)
  const REACH_DISTANCE_METERS = 10; 

  // Grid dimensions (~50m latitude height per tile)
  const PLOT_SIZE_LAT = 0.00045; 

  // Track claimed plots and collected coins persistent in session
  const claimedPlots = new Set();
  const collectedCoins = new Set();

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    center: [userLng, userLat],
    zoom: 18
  });

  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
    trackUserLocation: true, showUserLocation: false, showAccuracyCircle: true
  });
  map.addControl(geolocate);

  const playerEl = document.createElement('div');
  playerEl.className = 'player-marker';

  const playerMarker = new maplibregl.Marker({
    element: playerEl,
    anchor: 'center'
  });

  // Calculate distance in meters (Haversine)
  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
      Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Deterministic 2D PRNG - Spawns identical coins worldwide for same (x,y)
  function pseudoRandom(x, y) {
    let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453123;
    return n - Math.floor(n);
  }

  // Calculate longitude width for a FIXED grid row integer Y
  function getRowLngSize(gridY) {
    const rowLat = gridY * PLOT_SIZE_LAT;
    const rad = rowLat * Math.PI / 180;
    return PLOT_SIZE_LAT / Math.cos(rad);
  }

  function createPlotFeature(gridX, gridY) {
    const minLat = gridY * PLOT_SIZE_LAT;
    const maxLat = (gridY + 1) * PLOT_SIZE_LAT;

    // Lock longitude step strictly to grid row latitude (prevents grid movement)
    const lngSize = getRowLngSize(gridY);
    const minLng = gridX * lngSize;
    const maxLng = (gridX + 1) * lngSize;

    const centerLat = (minLat + maxLat) / 2;
    const centerLng = (minLng + maxLng) / 2;
    const plotId = `plot_${gridY}_${gridX}`;

    const isClaimed = claimedPlots.has(plotId);
    const isCoinCollected = collectedCoins.has(plotId);

    // Deterministic World Spawner (~35% tile coin chance globally)
    const rawCoinRoll = pseudoRandom(gridX, gridY);
    const hasCoin = rawCoinRoll < 0.35 && !isCoinCollected && !isClaimed;

    return {
      type: 'Feature',
      properties: {
        plotId: plotId,
        isClaimed: isClaimed,
        hasCoin: hasCoin,
        centerLat: centerLat,
        centerLng: centerLng
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [minLng, minLat],
          [maxLng, minLat],
          [maxLng, maxLat],
          [minLng, maxLat],
          [minLng, minLat]
        ]]
      }
    };
  }

  function generateSquareGrid(centerLat, centerLng) {
    const features = [];
    const gridRadius = 8; // Render ~800m range around player

    const playerGridY = Math.floor(centerLat / PLOT_SIZE_LAT);
    const playerRowLngSize = getRowLngSize(playerGridY);
    const playerGridX = Math.floor(centerLng / playerRowLngSize);

    for (let x = -gridRadius; x <= gridRadius; x++) {
      for (let y = -gridRadius; y <= gridRadius; y++) {
        features.push(createPlotFeature(playerGridX + x, playerGridY + y));
      }
    }
    return features;
  }

  function updateAutoCenterUI() {
    const btn = document.getElementById('autocenter-button');
    if (autoCenterEnabled) {
      btn.className = 'btn autocenter-on';
      btn.innerText = '🎯 Auto-Center: ON';
    } else {
      btn.className = 'btn autocenter-off';
      btn.innerText = '📍 Auto-Center: OFF (Tap to Lock)';
    }
  }

  map.on('load', () => {
    // RPG Style Overrides
    map.getStyle().layers.forEach(layer => {
      const id = layer.id.toLowerCase();
      if (id.includes('building')) map.setLayoutProperty(layer.id, 'visibility', 'none');
      if (id.includes('water') || id.includes('river') || id.includes('lake')) {
        if (layer.type === 'fill') map.setPaintProperty(layer.id, 'fill-color', '#2b65ec');
      }
      if (layer.type === 'background') map.setPaintProperty(layer.id, 'background-color', '#3e7b41');
      if ((id.includes('land') || id.includes('park') || id.includes('green')) && layer.type === 'fill' && !id.includes('water')) {
        map.setPaintProperty(layer.id, 'fill-color', '#488a4b');
      }
    });

    const initialFeatures = generateSquareGrid(userLat, userLng);

    map.addSource('square-plots', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: initialFeatures }
    });

    // Plot Fills
    map.addLayer({
      id: 'plots-fill',
      type: 'fill',
      source: 'square-plots',
      paint: {
        'fill-color': ['case', ['get', 'isClaimed'], '#2563eb', '#10b981'],
        'fill-opacity': ['case', ['get', 'isClaimed'], 0.45, 0.2]
      }
    });

    // Plot Outlines
    map.addLayer({
      id: 'plots-outline',
      type: 'line',
      source: 'square-plots',
      paint: {
        'line-color': '#1e293b',
        'line-width': 1.5,
        'line-opacity': 0.6
      }
    });

    // 🪙 World Coin Overlay Layer
    map.addLayer({
      id: 'plots-coins',
      type: 'symbol',
      source: 'square-plots',
      filter: ['get', 'hasCoin'],
      layout: {
        'text-field': '🪙',
        'text-size': 22,
        'text-allow-overlap': true,
        'text-ignore-placement': true
      }
    });

    document.getElementById('gps-button').addEventListener('click', () => {
      document.getElementById('status').innerText = '⌛ Acquiring GPS fix...';
      geolocate.trigger();
    });

    document.getElementById('autocenter-button').addEventListener('click', () => {
      autoCenterEnabled = !autoCenterEnabled;
      updateAutoCenterUI();
      if (autoCenterEnabled) map.flyTo({ center: [userLng, userLat], zoom: 18, essential: true });
    });

    map.on('dragstart', () => { if (autoCenterEnabled) { autoCenterEnabled = false; updateAutoCenterUI(); } });

    geolocate.on('geolocate', (e) => {
      userLat = e.coords.latitude;
      userLng = e.coords.longitude;

      document.getElementById('status').innerText = `📍 Signal Active (${e.coords.accuracy.toFixed(0)}m accuracy)`;
      document.getElementById('gps-button').style.display = 'none';
      document.getElementById('autocenter-button').style.display = 'block';

      playerMarker.setLngLat([userLng, userLat]).addTo(map);

      // Refresh surrounding grid
      map.getSource('square-plots').setData({
        type: 'FeatureCollection',
        features: generateSquareGrid(userLat, userLng)
      });

      if (autoCenterEnabled) {
        map.easeTo({ center: [userLng, userLat], zoom: 18, duration: 1000, essential: true });
      }
    });

    // Click Interaction (Checks 10m range)
    map.on('click', 'plots-fill', (e) => {
      const props = e.features[0].properties;
      const distMeters = getDistanceMeters(userLat, userLng, props.centerLat, props.centerLng);
      const isReachable = distMeters <= REACH_DISTANCE_METERS;

      let statusBadge = '';
      let actionHtml = '';

      if (props.isClaimed) {
        statusBadge = '<span class="badge claimed">Claimed Territory</span>';
      } else if (isReachable) {
        statusBadge = `<span class="badge reachable">In Range (${distMeters.toFixed(1)}m)</span>`;
        if (props.hasCoin) {
          actionHtml = `<button id="claim-btn" class="btn claim-btn">🪙 Grab Coin (+50 Gold) & Claim Plot</button>`;
        } else {
          actionHtml = `<button id="claim-btn" class="btn claim-btn">🚩 Claim Empty Plot</button>`;
        }
      } else {
        const needed = (distMeters - REACH_DISTANCE_METERS).toFixed(1);
        statusBadge = `<span class="badge unreachable">Too Far (${distMeters.toFixed(1)}m away)</span>`;
        actionHtml = `<button class="btn claim-btn" disabled>🔒 Walk ${needed}m closer</button>`;
      }

      document.getElementById('plot-info').innerHTML = `
        <b>Plot:</b> ${props.plotId}<br/>
        <b>Distance:</b> ${distMeters.toFixed(1)} meters<br/>
        <b>Status:</b> ${statusBadge}<br/>
        ${actionHtml}
      `;

      const claimBtn = document.getElementById('claim-btn');
      if (claimBtn) {
        claimBtn.addEventListener('click', () => {
          claimedPlots.add(props.plotId);
          if (props.hasCoin) {
            collectedCoins.add(props.plotId);
            totalGold += 50;
            document.getElementById('gold-counter').innerText = `🪙 ${totalGold} Gold`;
          }

          map.getSource('square-plots').setData({
            type: 'FeatureCollection',
            features: generateSquareGrid(userLat, userLng)
          });

          document.getElementById('plot-info').innerHTML = `
            <b>Plot:</b> ${props.plotId}<br/>
            <b>Status:</b> <span class="badge claimed">Claimed!</span>
          `;
        });
      }
    });
  });
</script>
</body>
</html>
