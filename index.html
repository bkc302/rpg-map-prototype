<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Realtime RPG Square Land Map</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    body { margin: 0; padding: 0; background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    
    /* Fullscreen Start Screen Overlay */
    #start-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(13, 17, 23, 0.96);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      color: #e6edf3;
    }
    #start-overlay h1 { font-size: 26px; margin-bottom: 8px; color: #facc15; }
    #start-overlay p { font-size: 15px; color: #94a3b8; max-width: 320px; margin-bottom: 20px; line-height: 1.4; }
    #start-status { font-size: 14px; color: #38bdf8; margin-top: 12px; min-height: 20px; }

    #ui-panel {
      position: absolute; 
      top: 12px; 
      left: 12px; 
      z-index: 10;
      width: 300px;
      max-width: calc(100vw - 24px);
      box-sizing: border-box;
      background: rgba(13, 17, 23, 0.92); 
      color: #e6edf3;
      padding: 14px 18px; 
      border-radius: 12px; 
      border: 1px solid #30363d;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      font-size: 15px;
      display: none; /* Hidden until game starts */
    }
    #ui-panel h3 { margin: 0 0 4px 0; font-size: 18px; }
    #gold-display { font-size: 16px; font-weight: bold; color: #facc15; margin-bottom: 2px; }
    #inventory-display { font-size: 13px; color: #a855f7; margin-bottom: 6px; font-weight: 500; }
    #status { font-size: 13px; color: #38bdf8; margin-bottom: 8px; }
    
    #plot-card {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
      font-size: 14px;
      line-height: 1.4;
    }

    .btn {
      width: 100%; padding: 12px; color: white;
      border: none; border-radius: 8px; font-weight: bold; font-size: 15px;
      cursor: pointer; transition: background-color 0.2s ease, opacity 0.2s ease;
    }
    .gps-btn { background-color: #2563eb; }
    .gps-btn:active { background-color: #1d4ed8; }
    
    .buy-btn { background-color: #16a34a; }
    .buy-btn:hover { background-color: #15803d; }
    .buy-btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.6; }

    .autocenter-on { background-color: #16a34a; }
    .autocenter-on:active { background-color: #15803d; }
    
    .autocenter-off { background-color: #475569; }
    .autocenter-off:active { background-color: #334155; }

    .badge {
      display: inline-block; padding: 3px 10px; font-size: 12px;
      border-radius: 6px; font-weight: bold; margin-top: 4px;
    }
    .claimed { background-color: #2563eb; color: #fff; }
    .wild { background-color: #10b981; color: #fff; }

    /* Outer Marker Containers (Positioned by MapLibre) */
    .player-marker-container {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gold-marker-container {
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Resized NPC container to match player dimensions exactly */
    .npc-marker-container {
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Inner Marker Visual Elements */
    .player-marker-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
    }

    .gold-marker-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
      animation: bounce 2s ease-in-out infinite;
    }

    .npc-marker-icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .maplibregl-ctrl-top-right,
    .maplibregl-ctrl-bottom-right {
      display: none !important;
    }
  </style>
</head>
<body>

<!-- Start Screen Overlay -->
<div id="start-overlay">
  <h1>⚔️ GPS Land Claimer</h1>
  <p>Acquire your GPS location to generate local territory grid squares and gold coins around you.</p>
  <button id="start-btn" class="btn gps-btn">📍 Find My Location & Start</button>
  <div id="start-status"></div>
</div>

<!-- Main Game UI Panel -->
<div id="ui-panel">
  <h3>⚔️ GPS Land Claimer</h3>
  <div id="gold-display">💰 Gold: <span id="gold-amount">100</span></div>
  <div id="inventory-display">🎒 Inventory: <span id="inventory-list">Empty</span></div>
  <div id="status">GPS Active</div>
  <button id="autocenter-button" class="btn autocenter-on">🎯 Auto-Center: ON</button>
  
  <div id="plot-card">
    <div id="plot-info"><i>Tap any square, coin, or NPC to inspect.</i></div>
  </div>

  <!-- Dev Reset Button -->
  <button id="dev-reset-btn" style="margin-top: 12px; width: 100%; padding: 6px; background: #991b1b; color: #fecaca; border: 1px solid #dc2626; border-radius: 6px; font-size: 11px; cursor: pointer;">
    ⚠️ Dev: Reset Game Save
  </button>
</div>

<div id="map"></div>

<script>
  let userLat = null;
  let userLng = null;
  let gameStarted = false;
  let autoCenterEnabled = true;

  // Game Economy, Inventory & Land Ownership State
  const savedGold = localStorage.getItem('rpg_player_gold');
  let playerGold = (savedGold !== null) ? parseInt(savedGold, 10) : 100;
  const PLOT_PRICE = 100;
  const AXE_PRICE = 20;
  
  const savedPlots = JSON.parse(localStorage.getItem('rpg_claimed_plots') || '[]');
  const claimedPlotIds = new Set(savedPlots);
  
  const savedInventory = JSON.parse(localStorage.getItem('rpg_player_inventory') || '[]');
  const playerInventory = new Set(savedInventory);

  let selectedPlotId = null;

  // Gold Spawning & Gathering System
  let activeGoldNodes = [];
  const MAX_GOLD_NODES = 15;
  const PICKUP_RADIUS_METERS = 12;
  const MAX_DESPAWN_DISTANCE_METERS = 250;

  // NPC Merchant State
  let npcNode = null;
  const NPC_TALK_RADIUS_METERS = 20;

  // SVG Fallback Data URIs
  const PLAYER_SVG_FALLBACK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%232563eb' stroke='%231d4ed8' stroke-width='3'/%3E%3Ccircle cx='24' cy='18' r='8' fill='%23fef08a'/%3E%3Cpath d='M12 38 C12 30 36 30 36 38' stroke='%23ffffff' stroke-width='3' fill='%231d4ed8'/%3E%3C/svg%3E";
  const GOLD_SVG_FALLBACK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23facc15' stroke='%23b45309' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fef08a' stroke='%23eab308' stroke-width='1.5'/%3E%3Ctext x='16' y='21' font-size='13' font-weight='bold' text-anchor='middle' fill='%23854d0e' font-family='sans-serif'%3E$%3C/text%3E%3C/svg%3E";
  const NPC_SVG_FALLBACK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%237c3aed' stroke='%235b21b6' stroke-width='3'/%3E%3Ccircle cx='24' cy='18' r='8' fill='%23fde047'/%3E%3Cpath d='M12 38 C12 30 36 30 36 38' stroke='%23ffffff' stroke-width='3' fill='%235b21b6'/%3E%3C/svg%3E";

  let wakeLock = null;
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
      await requestWakeLock();
    }
  });

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    center: [0, 0],
    zoom: 2
  });

  const geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
    trackUserLocation: true,
    showUserLocation: false,
    showAccuracyCircle: true
  });

  map.addControl(geolocate);

  // Player Marker Construction using <img> with onerror fallback
  const playerContainer = document.createElement('div');
  playerContainer.className = 'player-marker-container';

  const playerImg = document.createElement('img');
  playerImg.className = 'player-marker-icon';
  playerImg.src = 'player.png';
  playerImg.onerror = function() {
    this.onerror = null;
    this.src = PLAYER_SVG_FALLBACK;
  };
  playerContainer.appendChild(playerImg);

  const playerMarker = new maplibregl.Marker({
    element: playerContainer,
    anchor: 'center'
  });

  // Global degree steps
  const LAT_GRID_SIZE_DEG = 0.00045; // Fixed height (~50m)
  let LNG_GRID_SIZE_DEG = 0.00045;   // Calculated ONCE on startup for 1:1 square ratio
  let gridInitialized = false;
  
  function initGridScaling(lat) {
    if (gridInitialized) return;
    const rad = lat * Math.PI / 180;
    LNG_GRID_SIZE_DEG = LAT_GRID_SIZE_DEG / Math.cos(rad);
    gridInitialized = true;
  }
  
  function latLngToGrid(lat, lng) {
    return {
      gridX: Math.floor(lng / LNG_GRID_SIZE_DEG),
      gridY: Math.floor(lat / LAT_GRID_SIZE_DEG)
    };
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function spawnNPC() {
    if (!userLat || !userLng || npcNode) return;

    const gridRadius = 4; // Spawns within the 9x9 grid (-4 to +4)
    const { gridX: playerGridX, gridY: playerGridY } = latLngToGrid(userLat, userLng);

    // Select a random offset within 9x9, avoiding (0,0) center
    let offsetX = 0;
    let offsetY = 0;
    while (offsetX === 0 && offsetY === 0) {
      offsetX = Math.floor(Math.random() * (gridRadius * 2 + 1)) - gridRadius;
      offsetY = Math.floor(Math.random() * (gridRadius * 2 + 1)) - gridRadius;
    }

    const targetGridX = playerGridX + offsetX;
    const targetGridY = playerGridY + offsetY;

    // Center NPC inside the chosen tile
    const npcLat = (targetGridY + 0.50) * LAT_GRID_SIZE_DEG;
    const npcLng = (targetGridX + 0.50) * LNG_GRID_SIZE_DEG;

    const npcContainer = document.createElement('div');
    npcContainer.className = 'npc-marker-container';

    const npcImg = document.createElement('img');
    npcImg.className = 'npc-marker-icon';
    npcImg.src = 'npc.png'; // Points directly to custom npc.png asset
    npcImg.onerror = function() {
      this.onerror = null;
      this.src = NPC_SVG_FALLBACK;
    };
    npcContainer.appendChild(npcImg);

    const marker = new maplibregl.Marker({
      element: npcContainer,
      anchor: 'center'
    }).setLngLat([npcLng, npcLat]).addTo(map);

    npcNode = {
      lat: npcLat,
      lng: npcLng,
      marker: marker
    };

    npcContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      renderNPCCard();
    });
  }

  function renderNPCCard() {
    if (!npcNode || !userLat || !userLng) return;

    const dist = getDistanceMeters(userLat, userLng, npcNode.lat, npcNode.lng);
    const distRounded = dist.toFixed(0);
    const inRange = dist <= NPC_TALK_RADIUS_METERS;
    const hasAxe = playerInventory.has('axe');
    const container = document.getElementById('plot-info');

    if (!inRange) {
      container.innerHTML = `
        <b>🧔‍♂️ Barnaby the Merchant:</b><br/>
        <b>Distance:</b> ${distRounded}m away<br/>
        <small style="color:#ef4444;">Walk within 20m to trade with him!</small>
      `;
      return;
    }

    if (hasAxe) {
      container.innerHTML = `
        <b>🧔‍♂️ Barnaby the Merchant:</b><br/>
        <i>"Good luck out there with that axe, adventurer!"</i><br/>
        <small style="color:#a855f7;">✨ You already own the Lumberjack Axe.</small>
      `;
      return;
    }

    const canAfford = playerGold >= AXE_PRICE;
    const buttonText = canAfford ? `🪓 Buy Axe (${AXE_PRICE} Gold)` : `❌ Need ${AXE_PRICE} Gold`;
    const disabledAttr = canAfford ? '' : 'disabled';

    container.innerHTML = `
      <b>🧔‍♂️ Barnaby the Merchant:</b><br/>
      <i>"Need something for chopping wood?"</i><br/>
      <b>Item:</b> 🪓 Lumberjack Axe<br/>
      <b>Price:</b> 💰 ${AXE_PRICE} Gold<br/>
      <button id="buy-axe-btn" class="btn buy-btn" style="margin-top:6px;" ${disabledAttr}>${buttonText}</button>
    `;

    if (canAfford) {
      document.getElementById('buy-axe-btn').addEventListener('click', buyAxe);
    }
  }

  function buyAxe() {
    if (playerGold >= AXE_PRICE && !playerInventory.has('axe')) {
      playerGold -= AXE_PRICE;
      playerInventory.add('axe');

      localStorage.setItem('rpg_player_gold', playerGold);
      localStorage.setItem('rpg_player_inventory', JSON.stringify(Array.from(playerInventory)));

      updateGoldDisplay();
      updateInventoryDisplay();
      renderNPCCard();
      document.getElementById('status').innerText = '🪓 Acquired Lumberjack Axe!';
    }
  }

  function cleanupDistantCoins() {
    if (!userLat || !userLng) return;
    for (let i = activeGoldNodes.length - 1; i >= 0; i--) {
      const node = activeGoldNodes[i];
      const dist = getDistanceMeters(userLat, userLng, node.lat, node.lng);
      if (dist > MAX_DESPAWN_DISTANCE_METERS) {
        node.marker.remove();
        activeGoldNodes.splice(i, 1);
      }
    }
  }

  function spawnSingleCoin() {
    if (!userLat || !userLng) return;
  
    cleanupDistantCoins();
  
    if (activeGoldNodes.length >= MAX_GOLD_NODES) return;
  
    const gridRadius = 3;
    const { gridX: playerGridX, gridY: playerGridY } = latLngToGrid(userLat, userLng);
  
    const POSITIONS = [
      { x: 0.50, y: 0.50 },
      { x: 0.20, y: 0.20 },
      { x: 0.80, y: 0.20 },
      { x: 0.20, y: 0.80 },
      { x: 0.80, y: 0.80 },
      { x: 0.50, y: 0.20 },
      { x: 0.50, y: 0.80 },
      { x: 0.20, y: 0.50 },
      { x: 0.80, y: 0.50 }
    ];
  
    for (let attempt = 0; attempt < 15; attempt++) {
      const offsetX = Math.floor(Math.random() * (gridRadius * 2 + 1)) - gridRadius;
      const offsetY = Math.floor(Math.random() * (gridRadius * 2 + 1)) - gridRadius;
  
      const targetGridX = playerGridX + offsetX;
      const targetGridY = playerGridY + offsetY;
      const cellId = `plot_${targetGridY}_${targetGridX}`;
  
      const slotIndex = Math.floor(Math.random() * POSITIONS.length);
      const slotId = `${cellId}_slot_${slotIndex}`;
  
      if (activeGoldNodes.some(node => node.slotId === slotId)) continue;
  
      const pos = POSITIONS[slotIndex];
      const goldLat = (targetGridY + pos.y) * LAT_GRID_SIZE_DEG;
      const goldLng = (targetGridX + pos.x) * LNG_GRID_SIZE_DEG;
  
      const weights = [1, 1, 1, 1, 1, 1, 2, 2, 3, 4, 5];
      const coinValue = weights[Math.floor(Math.random() * weights.length)];
  
      const goldContainer = document.createElement('div');
      goldContainer.className = 'gold-marker-container';
  
      const goldImg = document.createElement('img');
      goldImg.className = 'gold-marker-icon';
      goldImg.src = 'gold.png';
      goldImg.onerror = function() {
        this.onerror = null;
        this.src = GOLD_SVG_FALLBACK;
      };
      goldContainer.appendChild(goldImg);
  
      const nodeId = `coin_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
  
      const marker = new maplibregl.Marker({
        element: goldContainer,
        anchor: 'center'
      }).setLngLat([goldLng, goldLat]).addTo(map);
  
      const goldNode = { 
        id: nodeId, 
        cellId: cellId, 
        slotId: slotId, 
        lat: goldLat, 
        lng: goldLng, 
        value: coinValue,
        marker: marker 
      };
      
      activeGoldNodes.push(goldNode);
  
      goldContainer.addEventListener('click', (e) => {
        e.stopPropagation();
        const dist = getDistanceMeters(userLat, userLng, goldLat, goldLng).toFixed(0);
        const valueLabel = coinValue === 5 ? '🌟 RARE GOLD CACHE' : '🪙 Gold Coin';
  
        document.getElementById('plot-info').innerHTML = `
          <b>${valueLabel}:</b> +${coinValue} Gold<br/>
          <b>Grid Square:</b> ${cellId}<br/>
          <b>Distance:</b> ${dist}m away<br/>
          <small style="color:#94a3b8;">Walk within 12m to pick up!</small>
        `;
      });
  
      break;
    }
  }

  function initCoinSpawns() {
    const initialCount = Math.floor(Math.random() * 3) + 4;
    for (let i = 0; i < initialCount; i++) {
      spawnSingleCoin();
    }
    setInterval(spawnSingleCoin, 20000);
  }

  function checkCoinProximity() {
    for (let i = activeGoldNodes.length - 1; i >= 0; i--) {
      const node = activeGoldNodes[i];
      const dist = getDistanceMeters(userLat, userLng, node.lat, node.lng);

      if (dist <= PICKUP_RADIUS_METERS) {
        playerGold += node.value;
        
        localStorage.setItem('rpg_player_gold', playerGold);
        updateGoldDisplay();
        
        const rarityText = node.value >= 4 ? '🌟 JACKPOT!' : '✨';
        document.getElementById('status').innerText = `${rarityText} Picked up +${node.value} Gold!`;
        
        node.marker.remove();
        activeGoldNodes.splice(i, 1);
        renderSelectedPlotCard();
      }
    }
  }

  function createPlotFeature(gridX, gridY) {
    const minLat = gridY * LAT_GRID_SIZE_DEG;
    const maxLat = (gridY + 1) * LAT_GRID_SIZE_DEG;
    
    const minLng = gridX * LNG_GRID_SIZE_DEG;
    const maxLng = (gridX + 1) * LNG_GRID_SIZE_DEG;
  
    const plotId = `plot_${gridY}_${gridX}`;
  
    return {
      type: 'Feature',
      properties: {
        plotId: plotId,
        isClaimed: claimedPlotIds.has(plotId),
        isSelected: (plotId === selectedPlotId)
      },
      geometry: {
        type: 'Polygon',
        coordinates: [[[minLng, minLat], [maxLng, minLat], [maxLng, maxLat], [minLng, maxLat], [minLng, minLat]]]
      }
    };
  }

  function generateSquareGrid(centerLat, centerLng) {
    const features = [];
    const gridRadius = 4;
  
    const { gridX: centerGridX, gridY: centerGridY } = latLngToGrid(centerLat, centerLng);
  
    for (let x = -gridRadius; x <= gridRadius; x++) {
      for (let y = -gridRadius; y <= gridRadius; y++) {
        features.push(createPlotFeature(centerGridX + x, centerGridY + y));
      }
    }
    return features;
  }

  function refreshMapGrid() {
    if (map.getSource('square-plots') && userLat && userLng) {
      map.getSource('square-plots').setData({
        type: 'FeatureCollection',
        features: generateSquareGrid(userLat, userLng)
      });
    }
  }

  function updateGoldDisplay() {
    document.getElementById('gold-amount').innerText = playerGold;
  }

  function updateInventoryDisplay() {
    const items = [];
    if (playerInventory.has('axe')) items.push('🪓 Axe');
    
    document.getElementById('inventory-list').innerText = items.length > 0 ? items.join(', ') : 'Empty';
  }

  function renderSelectedPlotCard() {
    const container = document.getElementById('plot-info');
    if (!selectedPlotId) {
      container.innerHTML = `<i>Tap any square, coin, or NPC to inspect.</i>`;
      return;
    }

    if (claimedPlotIds.has(selectedPlotId)) {
      container.innerHTML = `
        <b>Plot ID:</b> ${selectedPlotId}<br/>
        <b>Status:</b> <span class="badge claimed">Claimed (Owned)</span>
      `;
    } else {
      const canAfford = playerGold >= PLOT_PRICE;
      const buttonText = canAfford ? `🛒 Buy Plot (${PLOT_PRICE} Gold)` : `❌ Need ${PLOT_PRICE} Gold`;
      const disabledAttr = canAfford ? '' : 'disabled';

      container.innerHTML = `
        <b>Plot ID:</b> ${selectedPlotId}<br/>
        <b>Price:</b> 💰 ${PLOT_PRICE} Gold<br/>
        <b>Status:</b> <span class="badge wild">Wilderness</span><br/>
        <button id="buy-plot-btn" class="btn buy-btn" ${disabledAttr}>${buttonText}</button>
      `;

      if (canAfford) {
        document.getElementById('buy-plot-btn').addEventListener('click', buySelectedPlot);
      }
    }
  }

  function buySelectedPlot() {
    if (!selectedPlotId || claimedPlotIds.has(selectedPlotId)) return;
    if (playerGold >= PLOT_PRICE) {
      playerGold -= PLOT_PRICE;
      claimedPlotIds.add(selectedPlotId);
      
      localStorage.setItem('rpg_player_gold', playerGold);
      localStorage.setItem('rpg_claimed_plots', JSON.stringify(Array.from(claimedPlotIds)));
  
      updateGoldDisplay();
      renderSelectedPlotCard();
      refreshMapGrid();
    }
  }

  function updateAutoCenterUI() {
    const btn = document.getElementById('autocenter-button');
    if (autoCenterEnabled) {
      btn.className = 'btn autocenter-on';
      btn.innerText = '🎯 Auto-Center: ON';
    } else {
      btn.className = 'btn autocenter-off';
      btn.innerText = '📍 Auto-Center: OFF (Tap to Lock)';
    }
  }

  // UI & GEOLOCATION EVENT LISTENERS
  document.getElementById('dev-reset-btn').addEventListener('click', () => {
    if (confirm("Reset all gold, inventory, and wipe owned plots?")) {
      localStorage.removeItem('rpg_player_gold');
      localStorage.removeItem('rpg_claimed_plots');
      localStorage.removeItem('rpg_player_inventory');
      
      playerGold = 100;
      claimedPlotIds.clear();
      playerInventory.clear();
      selectedPlotId = null;
  
      updateGoldDisplay();
      updateInventoryDisplay();
      renderSelectedPlotCard();
      refreshMapGrid();
      
      alert("Save data cleared!");
    }
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    document.getElementById('start-status').innerText = '⌛ Acquiring GPS fix...';
    geolocate.trigger();
  });

  document.getElementById('autocenter-button').addEventListener('click', () => {
    autoCenterEnabled = !autoCenterEnabled;
    updateAutoCenterUI();
    if (autoCenterEnabled && userLat && userLng) {
      map.flyTo({ center: [userLng, userLat], zoom: 18, essential: true });
    }
  });

  geolocate.on('geolocate', (e) => {
    userLat = e.coords.latitude;
    userLng = e.coords.longitude;
    
    initGridScaling(userLat);

    requestWakeLock();
    cleanupDistantCoins();

    if (!gameStarted) {
      gameStarted = true;
      document.getElementById('start-overlay').style.display = 'none';
      document.getElementById('ui-panel').style.display = 'block';
      
      updateGoldDisplay();
      updateInventoryDisplay();

      playerMarker.setLngLat([userLng, userLat]).addTo(map);
      refreshMapGrid();
      initCoinSpawns();
      spawnNPC();

      map.jumpTo({ center: [userLng, userLat], zoom: 18 });
    } else {
      playerMarker.setLngLat([userLng, userLat]);
      refreshMapGrid();
      checkCoinProximity();

      if (autoCenterEnabled) {
        map.easeTo({ center: [userLng, userLat], zoom: 18, duration: 1000, essential: true });
      }
    }

    document.getElementById('status').innerText = `📍 Signal Active (${e.coords.accuracy.toFixed(0)}m accuracy)`;
  });

  geolocate.on('error', (e) => {
    let errorMsg = 'Unknown GPS Error';
    if (e.code === 1) errorMsg = 'Permission Denied - Please enable location access';
    if (e.code === 2) errorMsg = 'Position Unavailable';
    if (e.code === 3) errorMsg = 'GPS Timed Out';

    const statusElem = gameStarted ? document.getElementById('status') : document.getElementById('start-status');
    if (statusElem) {
      statusElem.innerHTML = `<span style="color:#ef4444;">⚠️ ${errorMsg}</span>`;
    }
  });

  // MAP INITIALIZATION & LAYER SETUP
  map.on('load', () => {
    try {
      const style = map.getStyle();
      if (style && style.layers) {
        style.layers.forEach(layer => {
          const id = layer.id.toLowerCase();
          if (id.includes('building')) map.setLayoutProperty(layer.id, 'visibility', 'none');
          if (id.includes('water') || id.includes('river') || id.includes('lake') || id.includes('ocean')) {
            if (layer.type === 'fill') map.setPaintProperty(layer.id, 'fill-color', '#2b65ec');
            else if (layer.type === 'line') map.setPaintProperty(layer.id, 'line-color', '#1d4ed8');
          }
          if (layer.type === 'background') map.setPaintProperty(layer.id, 'background-color', '#3e7b41');
          if ((id.includes('land') || id.includes('park') || id.includes('green') || id.includes('wood')) && layer.type === 'fill' && !id.includes('water')) {
            map.setPaintProperty(layer.id, 'fill-color', '#488a4b');
          }
          if ((id.includes('road') || id.includes('highway') || id.includes('street')) && layer.type === 'line') {
            map.setPaintProperty(layer.id, 'line-color', id.includes('case') ? '#5c4028' : '#9e7853');
          }
          if (layer.type === 'symbol') map.setLayoutProperty(layer.id, 'visibility', 'none');
        });
      }
    } catch (err) {
      console.warn('Map styling override warning:', err);
    }

    map.addSource('square-plots', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    map.addLayer({
      id: 'plots-fill',
      type: 'fill',
      source: 'square-plots',
      paint: { 'fill-color': '#000000', 'fill-opacity': 0 }
    });

    map.addLayer({
      id: 'plots-outline',
      type: 'line',
      source: 'square-plots',
      filter: ['all', ['!', ['get', 'isClaimed']], ['!', ['get', 'isSelected']]],
      paint: { 'line-color': '#1e293b', 'line-width': 2, 'line-opacity': 0.7 }
    });

    map.addLayer({
      id: 'plots-selected-outline',
      type: 'line',
      source: 'square-plots',
      filter: ['get', 'isSelected'],
      paint: { 'line-color': '#ef4444', 'line-width': 4, 'line-opacity': 1.0 }
    });

    map.addLayer({
      id: 'plots-claimed-outline',
      type: 'line',
      source: 'square-plots',
      filter: ['get', 'isClaimed'],
      paint: { 'line-color': '#eab308', 'line-width': 4, 'line-opacity': 1.0 }
    });

    map.on('dragstart', () => {
      if (autoCenterEnabled) {
        autoCenterEnabled = false;
        updateAutoCenterUI();
      }
    });

    map.on('zoomstart', (e) => {
      if (e.originalEvent && autoCenterEnabled) {
        autoCenterEnabled = false;
        updateAutoCenterUI();
      }
    });

    map.on('click', 'plots-fill', (e) => {
      if (e.features.length > 0) {
        selectedPlotId = e.features[0].properties.plotId;
        renderSelectedPlotCard();
        refreshMapGrid();
      }
    });

    if (userLat && userLng) {
      refreshMapGrid();
    }
  });
</script>
</body>
</html>
